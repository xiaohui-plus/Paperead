[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperead"
version = "0.1.3"
description = "学术论文 PDF 版面重排 + 英中逐段翻译（双栏、图表、公式）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "pymupdf>=1.26",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
paperead = "paperead.cli:main"

[project.urls]
Homepage = "https://github.com/xiaohui-plus/Paperead"
Repository = "https://github.com/xiaohui-plus/Paperead"
Issues = "https://github.com/xiaohui-plus/Paperead/issues"

[tool.setuptools.packages.find]
include = ["paperead*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
