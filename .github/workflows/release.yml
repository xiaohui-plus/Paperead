name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install JS dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Install agent dependencies
        run: pnpm --dir agent install --frozen-lockfile

      - name: Install Python build environment
        run: |
          uv venv .venv-build --python 3.12
          uv pip install --python .venv-build\Scripts\python.exe -e ".[server]" pytest "pyinstaller>=6.10"

      - name: Build frontend
        run: npm --prefix web run build

      - name: Run backend tests
        run: .venv-build\Scripts\python.exe -m pytest -q

      - name: Build Python sidecar
        shell: pwsh
        run: .\scripts\build-sidecar.ps1

      - name: Stage agent resources
        shell: pwsh
        run: .\scripts\stage-agent.ps1

      - name: Stage bundled tools (pandoc)
        shell: pwsh
        run: .\scripts\stage-tools.ps1

      - name: Sync version from tag
        shell: pwsh
        run: .venv-build\Scripts\python.exe scripts\set_version.py "${{ github.ref_name }}"

      - name: Seed NSIS cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:LOCALAPPDATA "tauri\NSIS"
          New-Item -ItemType Directory -Force $cache | Out-Null
          Expand-Archive tools\nsis-cache.zip -DestinationPath $cache -Force

      - name: Build installer and publish draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Paperead ${{ github.ref_name }}"
          releaseBody: |
            ## 本次更新

            - **正文行内公式还原**：解析时按字体、字号与基线，把 `PquerySPD(i,j)` 这类拍平文本重建为 LaTeX；分式、矩阵等规则无法还原的结构自动裁成小图内联显示，字母不再出错
            - **旧论文补公式**：配好识图模型后，重新打开旧论文会自动把公式截图批量转成 LaTeX，不重新解析版面，也不动已有译文和标注
            - **公式到处都能渲染**：助手回复里的 `\(...\)`、`\[...\]`、`\begin{equation}` 等写法会先统一成 KaTeX 可识别格式，不再直接显示 LaTeX 源码；公式编号后的 `\quad`、逗号等残留也会清掉
            - **中文文献不再自动翻译**：按正文和标题识别原文语种，中文论文默认关闭自动翻译，外文论文照旧自动翻译；顶栏可对单篇论文临时打开，并记住选择
            - **顶栏快捷开关**：自动阅读重点、自动翻译改成顶栏图标开关；PDF「新窗口」也改成图标，顶栏更清爽
            - **图注随正文翻译**：历史论文的图注/表注块现在也会翻译，图表栏不再只有英文
            - **版面解析更准**：跨栏/跨页段落合并、图注与图表配对、表格误判过滤；只有编号的 `TABLE I` 也能接回表注
            - **参考文献对齐**：按递增编号补切被合并的条目，保留抽不出标题的条目，正文 `[22]` 之后的引用不再错位
            - **重复导入去重**：同一文件夹重复导入同一份 PDF 会直接复用已有论文，不再出现两个副本、其中一个停在旧解析结果
            - **更新更可靠**：设置页显示下载进度百分比，安装程序启动后才退出；检查更新改用安装包自身版本，避免 sidecar 版本不一致时误报；打开设置页几分钟后会自动复查
            - **模型列表更新**：硅基流动新增 GLM-5.2、LongCat 2.0、DeepSeek V4 Flash，并提示模型 ID 以模型广场为准

            ## Windows 10/11 x64

            - 安装包：`Paperead_*_x64-setup.exe`（推荐，per-user 安装，不弹 UAC）
            - 自动更新清单：`latest.json`（仅 Windows 使用）
            - pandoc 下载源：`pandoc-2.19.2-windows-x86_64.zip`

            安装包不内置 pandoc：首次启动会在后台自动下载一次（约 24MB），
            之后离线可用；也可以在「设置 → 常规设置 → 写作工具」里手动重试。
            PDF 与阅读数据默认保存在 `%LOCALAPPDATA%\\paperead-data`。
            模型配置、文献与设置也都存在这里，覆盖安装 / 自动更新不会清除。

            > 本轮仅提供 Windows x64 安装包，不发布 Android APK。

            ## 通用

            - 首次启动会引导填写模型 API Key。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis

      - name: Upload pandoc download source to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            release/pandoc-*.zip
