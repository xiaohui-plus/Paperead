name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install JS dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Install agent dependencies
        run: pnpm --dir agent install --frozen-lockfile

      - name: Install Python build environment
        run: |
          uv venv .venv-build --python 3.12
          uv pip install --python .venv-build\Scripts\python.exe -e ".[server]" pytest "pyinstaller>=6.10"

      - name: Build frontend
        run: npm --prefix web run build

      - name: Run backend tests
        run: .venv-build\Scripts\python.exe -m pytest -q

      - name: Build Python sidecar
        shell: pwsh
        run: .\scripts\build-sidecar.ps1

      - name: Stage agent resources
        shell: pwsh
        run: .\scripts\stage-agent.ps1

      - name: Stage bundled tools (pandoc)
        shell: pwsh
        run: .\scripts\stage-tools.ps1

      - name: Sync version from tag
        shell: pwsh
        run: .venv-build\Scripts\python.exe scripts\set_version.py "${{ github.ref_name }}"

      - name: Seed NSIS cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:LOCALAPPDATA "tauri\NSIS"
          New-Item -ItemType Directory -Force $cache | Out-Null
          Expand-Archive tools\nsis-cache.zip -DestinationPath $cache -Force

      - name: Build installer and publish draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Paperead ${{ github.ref_name }}"
          releaseBody: |
            ## 本次更新

            - **开始聊天框直接选文件夹**：研究与写综述的输入框新增工作文件夹选择器，点一下能看到最近打开过的目录，也可以调起系统文件夹选择框打开新目录；选中的目录就是项目根目录，agent 在这个目录里读写文件（桌面端）
            - **升级不再重配**：模型配置与所有 `paperead.*` 设置会额外备份到数据目录，换端口、覆盖安装、自动更新后自动恢复；研究 agent 复用阅读助手同一套模型与 Key，切换模型即时生效
            - **原版 PDF 标注**：原版 PDF 视图支持按页选中标注，双语对照片段同步高亮，批注与高亮都能落在原文坐标上
            - **Zotero 免密钥**：Zotero 本地 API 不可用时自动回退只读本地数据库，没配 API Key 也能预览和导入条目
            - **解析修复**：修正表格检测把正文误判成表格的问题
            - **研究失败可排查**：发送前复检模型配置，失败原因直接显示在会话里，不再只转圈

            ## Windows 10/11 x64

            - 安装包：`Paperead_*_x64-setup.exe`（推荐，per-user 安装，不弹 UAC）
            - 便携版：`Paperead_*_portable_x64.zip`（自带 pandoc，解压后双击「启动.cmd」，完全离线）
            - 自动更新清单：`latest.json`（仅 Windows 使用）
            - pandoc 下载源：`pandoc-2.19.2-windows-x86_64.zip`

            安装包不内置 pandoc：首次启动会在后台自动下载一次（约 24MB），
            之后离线可用；也可以在「设置 → 常规设置 → 写作工具」里手动重试。
            PDF 与阅读数据默认保存在 `%LOCALAPPDATA%\\paperead-data`。
            模型配置、文献与设置也都存在这里，覆盖安装 / 自动更新不会清除。

            ## Android（arm64）

            - APK：`Paperead_*_android-arm64.apk`（Android 8.0 / API 24 及以上，arm64 设备）
            - 手机端是「内置前端 + 连电脑后端」：先在电脑上运行 Paperead 桌面版，
              手机与电脑在同一个局域网，打开 App 后填写电脑地址（或扫桌面端二维码配对）。
            - 手机端支持文献库、阅读、离线缓存与设备同步；研究与写综述仍在电脑端完成。

            ## 通用

            - 源码：`Paperead_*_source.zip`
            - 首次启动会引导填写模型 API Key；手机端配对后沿用电脑上的模型配置。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis

      - name: Build portable ZIP and source archive
        shell: pwsh
        run: |
          .\scripts\build-portable.ps1
          git archive --format=zip --prefix=Paperead-${{ github.ref_name }}/ --output=release/Paperead_${{ github.ref_name }}_source.zip HEAD

      - name: Upload portable and source to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            release/Paperead_*_portable_x64.zip
            release/Paperead_*_source.zip
            release/pandoc-*.zip
