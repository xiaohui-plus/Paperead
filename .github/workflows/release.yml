name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    # SignPath 获批前 secret 为空，整段签名流程自动跳过，发布链路保持原样。
    env:
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            extensions/browser/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install JS dependencies
        run: |
          npm ci
          npm ci --prefix web
          npm ci --prefix extensions/browser

      - name: Install agent dependencies
        run: pnpm --dir agent install --frozen-lockfile

      - name: Install Python build environment
        run: |
          uv venv .venv-build --python 3.12
          uv pip install --python .venv-build\Scripts\python.exe -e ".[server]" pytest "pyinstaller>=6.10"

      - name: Build frontend
        run: npm --prefix web run build

      - name: Run backend tests
        run: .venv-build\Scripts\python.exe -m pytest -q

      - name: Build Python sidecar
        shell: pwsh
        run: .\scripts\build-sidecar.ps1

      - name: Stage agent resources
        shell: pwsh
        run: .\scripts\stage-agent.ps1

      - name: Stage bundled tools (pandoc)
        shell: pwsh
        run: .\scripts\stage-tools.ps1

      - name: Stage browser extension resources
        shell: pwsh
        run: .\scripts\stage-extension.ps1

      - name: Sync version from tag
        shell: pwsh
        run: .venv-build\Scripts\python.exe scripts\set_version.py "${{ github.ref_name }}"

      - name: Seed NSIS cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:LOCALAPPDATA "tauri\NSIS"
          New-Item -ItemType Directory -Force $cache | Out-Null
          Expand-Archive tools\nsis-cache.zip -DestinationPath $cache -Force

      - name: Build installer and publish draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Paperead ${{ github.ref_name }}"
          releaseBody: |
            ## 本次更新

            - **OpenAI GPT 支持**：设置页新增 OpenAI 预设，含 GPT-5.6 Sol / Terra / Luna 与 GPT-6.2 / 6.1 系列，默认 GPT-5.6 Sol；GPT-5/6 与 o 系列自动改用 `max_completion_tokens` 并去掉采样参数，阅读问答、研究与手机端都能直接调用
            - **Word / LaTeX 统一论文版式**：中文稿正文统一为小四仿宋、西文与数字 Times New Roman、1.2 倍行距、首行缩进 2 字符、两端对齐且末行不拉伸；一/二/三级标题分别为三号黑体、小三黑体、四号宋体加粗，DOCX 与 LaTeX 完全一致
            - **LaTeX 引擎一键安装**：设置页「写作工具」新增 MiKTeX 便携版自动安装，下载、宏包、安装、配置自动补包与中文支持全程可见；装在应用数据目录，不需要管理员、不改系统 PATH，装完立即生效无需重启，缺宏包会在导出时自动补齐
            - **论文初稿模板（问题导向）**：新增 `paper-draft` 内置模板，按「研究问题—现有不足—本文设计—待检验假设—检验方式—证据状态」的论证关系表逐节起草，附摘要、引言、方法、实验、结果讨论、结论的句式与语言规范
            - **预印本检索**：学术检索新增「预印本」数据源，经 Europe PMC 覆盖 bioRxiv / medRxiv 等，网页检索与研究 agent 都可用；结果按发布平台显示 venue
            - **PDF 缩放与手型工具**：阅读页支持 Ctrl/⌘ + 滚轮缩放（1–3 倍）与顶栏手型工具拖拽平移，放大后可点百分比一键恢复适配宽度；原版 PDF 与双栏共用同一套操作
            - **翻译进度不再回退**：进度统一以服务端任务为准，排版阶段保持进度并显示完成度，顶栏「已翻译 x/y 段」与右栏骨架、进度线口径一致
            - **文件夹选择更顺手**：桌面端选择项目工作目录改用系统文件夹选择器，输入框只显示最后一级目录名
            - **研究技能强化**：找文献支持文献真实性核对、多源对比矩阵与检索记录，状态词统一为「已核对 / 未核实 / 有争议 / 检索不到」；设计研究新增复现规划、训练配方与论文-代码一致性审计；整理文献支持长文分窗摘要；写作技能支持按 FATAL / MAJOR / MINOR 出具审稿意见
            - **更新只升不降**：清单版本不高于当前版本时不再提示更新，后台残留的旧版安装包会自动清理，侧栏不会再出现装回旧版本的入口
            - **其他**：模型连通性测试放宽输出上限，避免思考模型只思考不回答；OpenAI SDK 最低版本提升到 1.50

            ## Windows 10/11 x64

            - 安装包：`Paperead_*_x64-setup.exe`（推荐，per-user 安装，不弹 UAC）
            - 自动更新清单：`latest.json`（仅 Windows 使用）
            - pandoc 下载源：`pandoc-2.19.2-windows-x86_64.zip`

            安装包不内置 pandoc：首次启动会在后台自动下载一次（约 24MB），
            之后离线可用；也可以在「设置 → 常规设置 → 写作工具」里手动重试。
            PDF 与阅读数据默认保存在安装目录下的 `data\\`（`%LOCALAPPDATA%\\Paperead\\data`）。
            模型配置、文献与设置也都存在这里，覆盖安装 / 自动更新不会清除。

            > 本轮仅提供 Windows x64 安装包，不发布 Android APK。

            ## 通用

            - 首次启动会引导填写模型 API Key。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis

      # ---------- SignPath Foundation：安装包 Authenticode 签名 ----------
      # 只签最终 setup.exe。NSIS 是先把内部 exe 打进去再产出安装包的，
      # 事后无法回填，而用户实际接触到的是下载的安装包。
      - name: Upload unsigned installer
        if: env.SIGNPATH_ENABLED == 'true'
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3

      - name: Submit signing request to SignPath
        if: env.SIGNPATH_ENABLED == 'true'
        id: signpath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: paperead
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace installer with signed build
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $zip = Get-ChildItem signed -Recurse -Filter *.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zip) { Expand-Archive $zip.FullName -DestinationPath signed -Force }
          $signed = Get-ChildItem signed -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $signed) { throw "SignPath 未返回签名产物" }
          $auth = Get-AuthenticodeSignature $signed.FullName
          if ($auth.Status -ne "Valid") { throw "签名产物校验失败：$($auth.Status)" }
          Copy-Item $signed.FullName src-tauri\target\release\bundle\nsis\ -Force
          Write-Host "已替换为签名安装包：$($signed.Name)"

      # Authenticode 签名改变了文件字节：Tauri 更新签名、SHA256、latest.json
      # 必须全部基于签名后的文件重算，否则用户端自动更新会校验失败。
      - name: Re-sign updater artifact
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $v = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = Get-Item "src-tauri\target\release\bundle\nsis\Paperead_${v}_x64-setup.exe"
          Remove-Item "$($exe.FullName).sig" -ErrorAction SilentlyContinue
          npm run tauri -- signer sign $exe.FullName
          if (-not (Test-Path "$($exe.FullName).sig")) { throw "minisign 重新签名失败" }

      - name: Rebuild checksums and updater manifest
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = Get-Item "src-tauri\target\release\bundle\nsis\Paperead_${v}_x64-setup.exe"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $exe.FullName release\ -Force
          Copy-Item "$($exe.FullName).sig" release\ -Force
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "$hash  $($exe.Name)" | Set-Content release\SHA256SUMS.txt -Encoding UTF8
          & .venv-build\Scripts\python.exe scripts\make_latest_json.py --version $v --installer "release\$($exe.Name)" --url "https://gitee.com/deng_xiaohui/paperead/releases/download/v$v/$($exe.Name)" --out release\latest.json

      - name: Replace release assets with signed build
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = Get-Item "release\Paperead_${v}_x64-setup.exe"
          gh release upload ${{ github.ref_name }} "$($exe.FullName)" "$($exe.FullName).sig" release\SHA256SUMS.txt release\latest.json --clobber --repo ${{ github.repository }}

      - name: Upload pandoc download source to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            release/pandoc-*.zip
