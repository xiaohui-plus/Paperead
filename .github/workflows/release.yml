name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install JS dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Install agent dependencies
        run: pnpm --dir agent install --frozen-lockfile

      - name: Install Python build environment
        run: |
          uv venv .venv-build --python 3.12
          uv pip install --python .venv-build\Scripts\python.exe -e ".[server]" pytest "pyinstaller>=6.10"

      - name: Build frontend
        run: npm --prefix web run build

      - name: Run backend tests
        run: .venv-build\Scripts\python.exe -m pytest -q

      - name: Build Python sidecar
        shell: pwsh
        run: .\scripts\build-sidecar.ps1

      - name: Stage agent resources
        shell: pwsh
        run: .\scripts\stage-agent.ps1

      - name: Stage bundled tools (pandoc)
        shell: pwsh
        run: .\scripts\stage-tools.ps1

      - name: Sync version from tag
        shell: pwsh
        run: .venv-build\Scripts\python.exe scripts\set_version.py "${{ github.ref_name }}"

      - name: Seed NSIS cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:LOCALAPPDATA "tauri\NSIS"
          New-Item -ItemType Directory -Force $cache | Out-Null
          Expand-Archive tools\nsis-cache.zip -DestinationPath $cache -Force

      - name: Build installer and publish draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Paperead ${{ github.ref_name }}"
          releaseBody: |
            ## 本次更新

            - **研究终端**：研究 agent 可以在项目文件夹里执行 PowerShell 命令（编译 LaTeX、跑 Python/R 分析、看 git 状态、做文件转换），命令输出和退出码直接显示在会话里
            - **权限三档**：输入框左下角可切换「只读分析 / 沙箱执行 / 完全权限」；沙箱执行只允许写项目文件夹，越界时向你单独申请
            - **审批即命令**：越权命令会先在输入框位置显示完整命令，选择「允许一次」或「拒绝」；拒绝后不会换写法偷偷重试
            - **输入框更清爽**：研究与写综述的输入框移除顶部项目条，模式与权限按钮并入底部左侧（桌面端）
            - **历史回放**：重新打开较长会话时先取历史快照再渲染，旧思考过程不会再被当成新一轮输出逐字重放
            - **沙箱拒绝可识别**：PowerShell 的非终止错误（如越界写入）退出码仍是 0，现在也会被识别为沙箱拒绝并弹出审批

            ## Windows 10/11 x64

            - 安装包：`Paperead_*_x64-setup.exe`（推荐，per-user 安装，不弹 UAC）
            - 自动更新清单：`latest.json`（仅 Windows 使用）
            - pandoc 下载源：`pandoc-2.19.2-windows-x86_64.zip`

            安装包不内置 pandoc：首次启动会在后台自动下载一次（约 24MB），
            之后离线可用；也可以在「设置 → 常规设置 → 写作工具」里手动重试。
            PDF 与阅读数据默认保存在 `%LOCALAPPDATA%\\paperead-data`。
            模型配置、文献与设置也都存在这里，覆盖安装 / 自动更新不会清除。

            ## Android（arm64）

            > 本轮随附 APK 时才有以下内容；只发 Windows 时请删除本节。

            - APK：`Paperead_*_android-arm64.apk`（Android 8.0 / API 24 及以上，arm64 设备）
            - 自动更新清单：`android.json`（仅 Android 使用）
            - 手机端是「内置前端 + 连电脑后端」：先在电脑上运行 Paperead 桌面版，
              手机与电脑在同一个局域网，打开 App 后填写电脑地址（或扫桌面端二维码配对）。
            - 手机端支持文献库、阅读、离线缓存与设备同步；研究与写综述仍在电脑端完成。
            - 手机端支持应用内自动更新：设置里检查到新版本后可直接下载并调起系统安装器。

            ## 通用

            - 首次启动会引导填写模型 API Key；手机端配对后沿用电脑上的模型配置。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis

      - name: Upload pandoc download source to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            release/pandoc-*.zip
