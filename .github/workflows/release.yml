name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install JS dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Install agent dependencies
        run: pnpm --dir agent install --frozen-lockfile

      - name: Install Python build environment
        run: |
          uv venv .venv-build --python 3.12
          uv pip install --python .venv-build\Scripts\python.exe -e ".[server]" pytest "pyinstaller>=6.10"

      - name: Build frontend
        run: npm --prefix web run build

      - name: Run backend tests
        run: .venv-build\Scripts\python.exe -m pytest -q

      - name: Build Python sidecar
        shell: pwsh
        run: .\scripts\build-sidecar.ps1

      - name: Stage agent resources
        shell: pwsh
        run: .\scripts\stage-agent.ps1

      - name: Stage bundled tools (pandoc)
        shell: pwsh
        run: .\scripts\stage-tools.ps1

      - name: Sync version from tag
        shell: pwsh
        run: .venv-build\Scripts\python.exe scripts\set_version.py "${{ github.ref_name }}"

      - name: Seed NSIS cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:LOCALAPPDATA "tauri\NSIS"
          New-Item -ItemType Directory -Force $cache | Out-Null
          Expand-Archive tools\nsis-cache.zip -DestinationPath $cache -Force

      - name: Build installer and publish draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Paperead ${{ github.ref_name }}"
          releaseBody: |
            ## 本次更新

            - **项目可绑定本机文件夹**：研究与综述项目可以把工作目录直接指向电脑上的任意文件夹，不复制、不改动原文件；项目文件面板可浏览子目录，并预览图片、PDF、Office、Markdown、代码等常见格式（仅桌面本机可用，局域网设备不能读取电脑文件）
            - **关窗不中断任务**：桌面端新增系统托盘，关闭窗口后研究与综述任务继续在后台执行；从托盘重新打开窗口，或选「退出」才会结束任务
            - **设置页重排**：分为配置模型 / 阅读界面 / 文献检索 / 论文模板 / 常规设置五类；更新、设备同步、离线库、学术阅读同步、写作工具统一收进「常规设置」
            - **阅读界面可调字号**：原文与译文可分别设置字号，并可选默认阅读模式；自动标记阅读重点也合并到这一页，改动即时生效
            - **公式识别更省调用**：识别结果按图片缓存并回写论文数据，同一张公式图不再重复请求模型
            - **解析修复**：图注续行会并回图注，支持 Nature 的 `Fig. 1 | ...` 与 Extended Data 图注、长图注；跨栏/跨页段落不再并成整页图，减少整页图化与图表配对错误
            - **会话标题唯一**：回答开头的一级标题提升到页面顶部，聊天流内不再重复显示

            ## Windows 10/11 x64

            - 安装包：`Paperead_*_x64-setup.exe`（推荐，per-user 安装，不弹 UAC）
            - 便携版：`Paperead_*_portable_x64.zip`（自带 pandoc，解压后双击「启动.cmd」，完全离线）
            - 自动更新清单：`latest.json`（仅 Windows 使用）
            - pandoc 下载源：`pandoc-2.19.2-windows-x86_64.zip`

            安装包不内置 pandoc：首次启动会在后台自动下载一次（约 24MB），
            之后离线可用；也可以在「设置 → 常规设置 → 写作工具」里手动重试。
            PDF 与阅读数据默认保存在 `%LOCALAPPDATA%\\paperead-data`。
            模型配置、文献与设置也都存在这里，覆盖安装 / 自动更新不会清除。

            ## Android（arm64）

            - APK：`Paperead_*_android-arm64.apk`（Android 8.0 / API 24 及以上，arm64 设备）
            - 手机端是「内置前端 + 连电脑后端」：先在电脑上运行 Paperead 桌面版，
              手机与电脑在同一个局域网，打开 App 后填写电脑地址（或扫桌面端二维码配对）。
            - 手机端支持文献库、阅读、离线缓存与设备同步；研究与写综述仍在电脑端完成。

            ## 通用

            - 源码：`Paperead_*_source.zip`
            - 首次启动会引导填写模型 API Key；手机端配对后沿用电脑上的模型配置。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis

      - name: Build portable ZIP and source archive
        shell: pwsh
        run: |
          .\scripts\build-portable.ps1
          git archive --format=zip --prefix=Paperead-${{ github.ref_name }}/ --output=release/Paperead_${{ github.ref_name }}_source.zip HEAD

      - name: Upload portable and source to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            release/Paperead_*_portable_x64.zip
            release/Paperead_*_source.zip
            release/pandoc-*.zip
