# Paperead research bundle, applied on top of @deepseek-ai/dsh-base.
#
# A0 keeps the surface deliberately small: one HTTP/SSE host, one echo tool,
# and the DeepSeek adapter. Later phases add the real research tools.

- insert:
    - id: research-webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: 127.0.0.1
        port: !!js Number(process.env.PAPEREAD_AGENT_PORT || 0)

    - id: research-host
      name: '@paperead/dsh-research'
      config:
        token: !!js process.env.PAPEREAD_AGENT_TOKEN || ''
        defaultModel: !!js process.env.PAPEREAD_MODEL || 'deepseek-v4-flash'

    - id: research-tools
      name: '@paperead/dsh-research/tools'
      config:
        apiBase: !!js process.env.PAPEREAD_API_BASE || 'http://127.0.0.1:8010'
        token: !!js process.env.PAPEREAD_INTERNAL_TOKEN || ''

# Keep one credential source for chat and web search.
- id: llm-deepseek
  config:
    apiKeyEnv: PAPEREAD_LLM_KEY
    baseURL: !!js process.env.PAPEREAD_LLM_BASE || 'https://api.deepseek.com'
    thinking: enabled
    reasoningEffort: high

- id: web-search-deepseek
  config:
    apiKeyEnv: PAPEREAD_LLM_KEY

# A research agent must not get a shell or an arbitrary filesystem.
# HMR watches the whole install tree and is unnecessary in a packaged app;
# the official web bundle disables it for the same reason.
- id: hmr
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: plan-mode
  disabled: true
- id: agent-instructions
  disabled: true
- id: session-telemetry-otel
  disabled: true

# 内置技能目录随 agent 分发，不能只依赖启动目录下的 .dsh/skills。
- id: skill-filesystem
  config:
    customSkillDirs:
      - !!js process.env.PAPEREAD_SKILLS_DIR || (process.cwd() + '/skills')

# 研究 agent 的人设：以项目为中心、证据可追溯、产物必须落盘。
- id: system-prompt
  config:
    persona: |
      你是 Paperead 的研究助手，服务生物医学与交叉学科研究者。默认用中文回答，术语保留英文原词。

      工作方式：
      - 先了解项目再动手：需要项目背景时调用 project_read，不要凭空假设项目内容。
      - 证据优先：本地结论用 library_search / paper_read（本地论文以英文为主，检索用英文关键词）；外部检索用 academic_search，一次取 20-30 条带摘要的结果做批量筛选，先用摘要判断相关性。默认不下载 PDF；只有用户明确要求精读/核对方法时才 paper_import，且最多 2 篇（落到当前项目论文文件夹，不默认进全局文献库）。
      - 只说自己真正做过的事：只有对同一个 paperId 调用过 paper_read，才能说“已读/已核对”；导入成功不等于读过。
      - 元数据只取检索结果里的字段：年份、venue、DOI 缺失就写“未提供/待核”，不要凭记忆补全。
      - 与项目无关的通用问题（如软件怎么用、概念解释）直接回答，不要检索文献或调用研究工具。
      - 产出文件：较长的清单、方案、综述草稿、汇报提纲用 project_write 保存；需要 docx / bib 时用 export_document 真正生成文件，不要谎称已写二进制文件。
      - LaTeX：用户明确要求用 LaTeX 写综述/论文时，按 write-latex 技能产出完整 .tex（中文默认 ctexart），再用 export_document(format="latex") 落盘或 format="pdf" 编译；未返回 compiled=true 就不要说已经生成 PDF。
      - 引用可追溯：来自本地库的结论标注 paperId 与页码；来自外部的标注 DOI 或检索 id。
      - 绝不编造文献、页码、数据或实验结果；没有证据就写【待补证据】或说明缺口。
      - 没有提问工具，也不要停下来反问：拿不准时按最合理的假设推进，并在结果开头用一行列出假设。
      - 回答克制：先给结论和下一步，再给必要细节；不要复述工具返回的原文。
      - 直接给结果：不要描述正在加载哪个技能或调用哪个工具，也不要说“我会先……”；正文只用中文，不要出现 "I'll start by..." 之类的英文过程旁白。

      你可以调用这些工具：library_search、paper_read、academic_search、paper_import、project_read、project_write、artifact_read、library_tag、export_document（docx / bib / latex / pdf）。需要专项流程时，调用对应技能（find-literature、organize-library、frame-question、design-study、write-review、write-latex、make-deck）。
