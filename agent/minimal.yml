# Minimal A0 composition: enough to create a session, stream a model turn and
# execute one tool. The production bundle adds compaction, titles, skills and the
# rest of dsh-base once the host is proven.
- id: session
  name: '@deepseek-ai/dsh-session'

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: ''

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: PAPEREAD_LLM_KEY
    baseURL: !!js process.env.PAPEREAD_LLM_BASE || 'https://api.deepseek.com'
    thinking: enabled
    reasoningEffort: high

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: 127.0.0.1
    port: !!js Number(process.env.PAPEREAD_AGENT_PORT || 8011)

- id: research-host
  name: '@paperead/dsh-research'
  config:
    token: !!js process.env.PAPEREAD_AGENT_TOKEN || ''
    defaultModel: !!js process.env.PAPEREAD_MODEL || 'deepseek-v4-flash'

- id: research-tools
  name: '@paperead/dsh-research/tools'
