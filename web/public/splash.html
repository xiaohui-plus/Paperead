<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paperead</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fafaf9;
    color: #1c1c1a;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #17171a; color: #e8e8e6; }
    .track { background: #2a2a2e; }
  }
  .boot { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .mark { font-size: 20px; font-weight: 500; letter-spacing: .18em; }
  .track { width: 148px; height: 2px; border-radius: 2px; background: #e4e4e1; overflow: hidden; }
  .bar {
    width: 40%;
    height: 100%;
    background: currentColor;
    opacity: .75;
    animation: slide 1.15s cubic-bezier(.4, 0, .2, 1) infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(320%); }
  }
</style>
</head>
<body>
  <div class="boot">
    <div class="mark">PAPEREAD</div>
    <div class="track"><div class="bar"></div></div>
  </div>
</body>
</html>
