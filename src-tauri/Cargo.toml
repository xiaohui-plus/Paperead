[package]
name = "paperead-desktop"
version = "0.1.8"
description = "Paperead desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "paperead_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# generate_context! 生成的代码在移动端也会引用 serde_json
serde_json = "1"

# 桌面端专用：sidecar / 研究 agent / 更新器；安卓壳不编译这些
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip", "system-proxy"] }
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
ureq = { version = "2", default-features = false, features = ["json"] }
rand = "0.8"
url = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# 手机端直连模型（流式）；桌面端走本机 sidecar，不需要这些
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
# 设备同步：扫描电脑上的二维码（原生相机 + 权限处理）
# 该插件的 build.rs 会把 tauri-api 复制到 crate 自己的 android/.tauri，
# 而 crates.io 缓存目录在本机不可写（拒绝访问），所以内置一份到 third_party。
tauri-plugin-barcode-scanner = { path = "../third_party/tauri-plugin-barcode-scanner" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
